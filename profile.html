<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>Mon profil — JobBoost AI</title>
<link rel="stylesheet" href="style.css">
</head>
<body>

<header class="topbar">
  <a href="dashboard.html" class="topbar__back">←</a>
  <div class="topbar__brand">Mon profil</div>
  <span style="width:32px;"></span>
</header>

<main class="container">
  <div id="alertBox" class="alert"></div>

  <div class="card">
    <div class="field"><label>Nom</label><input id="displayName" type="text"></div>
    <div class="field"><label>Email</label><input id="email" type="text" disabled></div>
    <div class="field"><label>Plan actuel</label><input id="planLabel" type="text" disabled></div>
    <div class="field"><label>Crédits restants</label><input id="credits" type="text" disabled></div>
    <button class="btn btn--primary" id="saveBtn">Enregistrer</button>
  </div>

  <div class="card">
    <h3>Confidentialité</h3>
    <p class="muted">Votre CV contient des informations personnelles. JobBoost AI ne l'affiche jamais à d'autres utilisateurs, ne le place jamais dans une URL, et vous permet de le supprimer à tout moment.</p>
  </div>

  <div class="card">
    <h3>Mes documents</h3>
    <button class="btn btn--secondary" id="deleteDocsBtn">Supprimer tous mes documents générés</button>
  </div>

  <div class="card">
    <h3>Zone dangereuse</h3>
    <button class="btn btn--danger" id="deleteAccountBtn">Supprimer mon compte</button>
  </div>

  <button class="btn btn--ghost" id="logoutBtn">Se déconnecter</button>
</main>

<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore-compat.js"></script>
<script src="firebase-config.js"></script>
<script src="app.js"></script>
<script>
let currentUser;

requireLogin(async (user) => {
  currentUser = user;
  const profile = await ensureUserProfile(user);
  document.getElementById('displayName').value = profile.displayName || '';
  document.getElementById('email').value = user.email || '';
  document.getElementById('planLabel').value = (profile.plan || 'free').toUpperCase();
  document.getElementById('credits').value = profile.credits ?? 0;
});

document.getElementById('saveBtn').addEventListener('click', async () => {
  hideAlert('alertBox');
  const btn = document.getElementById('saveBtn');
  setButtonLoading(btn, true, 'Enregistrement...');
  try {
    await db.collection('users').doc(currentUser.uid).update({
      displayName: document.getElementById('displayName').value.trim(),
      updatedAt: new Date().toISOString()
    });
    showAlert('alertBox', 'Profil mis à jour.', 'success');
  } catch (err) {
    showAlert('alertBox', 'Impossible de mettre à jour le profil.');
  } finally {
    setButtonLoading(btn, false);
  }
});

document.getElementById('deleteDocsBtn').addEventListener('click', async () => {
  if (!confirm('Supprimer définitivement tous vos documents générés ?')) return;
  hideAlert('alertBox');
  try {
    const snap = await db.collection('users').doc(currentUser.uid).collection('documents').get();
    const batch = db.batch();
    snap.forEach((doc) => batch.delete(doc.ref));
    await batch.commit();
    showAlert('alertBox', 'Documents supprimés.', 'success');
  } catch (err) {
    showAlert('alertBox', 'Impossible de supprimer les documents.');
  }
});

document.getElementById('deleteAccountBtn').addEventListener('click', async () => {
  if (!confirm('Cette action est irréversible. Supprimer définitivement votre compte et vos données ?')) return;
  hideAlert('alertBox');
  try {
    const snap = await db.collection('users').doc(currentUser.uid).collection('documents').get();
    const batch = db.batch();
    snap.forEach((doc) => batch.delete(doc.ref));
    await batch.commit();
    await db.collection('users').doc(currentUser.uid).delete();
    await currentUser.delete();
    window.location.href = 'index.html';
  } catch (err) {
    showAlert('alertBox', 'Impossible de supprimer le compte. Reconnectez-vous et réessayez (Firebase exige une session récente pour cette action).');
  }
});

document.getElementById('logoutBtn').addEventListener('click', logout);
</script>
</body>
</html>
